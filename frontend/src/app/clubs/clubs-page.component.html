<main class="clubs-shell">
  <a class="back-link" routerLink="/home">&larr; Home</a>
  <header>
    <p class="eyebrow">Clubs</p>
    <h1>Playing communities</h1>
  </header>

  <section class="club-list" aria-label="Club directory">
    <article class="club-entry">
      <img [src]="logoUrl" alt="Sorsogon Pickleball Club logo" />
      <div>
        <p class="club-location">Sorsogon City</p>
        <h2>Sorsogon Pickleball Club</h2>
        <p>Home club for local open play, member matches, and arena events.</p>
      </div>
    </article>
  </section>
</main>
