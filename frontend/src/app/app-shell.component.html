<div class="app-shell">
  <header class="global-brand">
    <a routerLink="/" aria-label="Sorsogon Pickleball Club home">
      <img [src]="logoUrl" alt="Sorsogon Pickleball Club logo" />
    </a>
  </header>
  @if (isNavigating()) {
    <div class="navigation-loading" role="status" aria-live="polite" aria-label="Loading page">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading page...</span>
    </div>
  }
  @if (showBreadcrumbs()) {
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        <li><a routerLink="/home">Home</a></li>
        <li aria-hidden="true">/</li>
        @if (breadcrumbParent(); as parent) {
          <li><a [routerLink]="parent.route">{{ parent.label }}</a></li>
          <li aria-hidden="true">/</li>
        }
        <li aria-current="page">{{ currentPageTitle() }}</li>
      </ol>
    </nav>
  }
  <router-outlet />
</div>
